apply plugin: 'com.android.application'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'com.mikepenz.aboutlibraries.plugin.android'
apply plugin: 'com.google.dagger.hilt.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'dev.detekt'

android {
    namespace = "wseemann.media.romote"

    signingConfigs {
        create("releaseConfig") {
            storeFile file('/Users/wseemann/Downloads/keystore')
            storePassword 'xxxxxxxxXX'
            keyAlias 'mykey'
            keyPassword 'xxxxxxxxXX'
        }
    }

    defaultConfig {
        applicationId "wseemann.media.romote"
        minSdkVersion 26
        targetSdk 36
        compileSdk 36
        versionCode 29
        versionName "1.0.29"
    }
    buildTypes {
        getByName("release") {
            signingConfig = signingConfigs.getByName("releaseConfig")
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
    buildFeatures {
        buildConfig = true
        aidl = true
        compose = true
    }
}

aboutLibraries {
    collect.fetchRemoteLicense = false
    collect.fetchRemoteFunding = false
    export.excludeFields = ["generated", "developers", "funding"]
}

detekt {
    config.setFrom(files("$rootDir/config/detekt/detekt.yml"))
    buildUponDefaultConfig = true
    parallel = true
}

// `check` otherwise only picks up the plain `detekt` task, which has no sources on Android.
// These are the variant-aware tasks that run with type resolution.
tasks.named('check') {
    dependsOn('detektMain', 'detektTest')
}

tasks.withType(dev.detekt.gradle.Detekt).configureEach {
    // Rewrites sources in place for every rule that supports it -- in practice the `ktlint`
    // ruleset below. Note that `check` depends on the detekt tasks, so `check` reformats too.
    autoCorrect = true

    reports {
        html.required = true
        sarif.required = true
        checkstyle.required = false
        markdown.required = false
    }
}

dependencies {
    detektPlugins(libs.detekt.rules.ktlint.wrapper)

    implementation(libs.aboutlibraries.compose.m3)
    implementation(platform(libs.compose.bom))
    implementation(libs.androidx.activity.compose)
    implementation(libs.androidx.appcompat)
    implementation(libs.androidx.lifecycle.runtime.compose)
    implementation(libs.androidx.lifecycle.viewmodel.ktx)
    implementation(libs.androidx.preference)
    implementation(libs.androidx.splashscreen)
    implementation(libs.android.material)
    implementation(libs.coil.compose)
    implementation(libs.coil.network.okhttp)
    implementation(libs.compose.material.icons.core)
    implementation(libs.compose.material3)
    implementation(libs.compose.ui)
    implementation(libs.compose.ui.tooling.preview)
    implementation(libs.hilt.android)
    ksp(libs.hilt.compiler)
    implementation(libs.jdom)
    implementation(libs.kotlinx.collections.immutable)
    implementation(libs.play.review.ktx)
    implementation(libs.roku.ecp.wrapper.kotlin)
    implementation(libs.timber)

    debugImplementation(libs.compose.ui.tooling)

    testImplementation(libs.junit)
    testImplementation(libs.kotlinx.coroutines.test)
}